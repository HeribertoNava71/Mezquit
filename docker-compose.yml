services:

  mysql:
    image: mysql:8.4
    container_name: mi_mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: Mezquit
      MYSQL_USER: mezquit
      MYSQL_PASSWORD: mezquit
      MYSQL_ROOT_PASSWORD: mezquit

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: